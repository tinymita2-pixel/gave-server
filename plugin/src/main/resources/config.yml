# 대기실에 minPlayers 명이 차면 30초 뒤 자동 시작(minPlayers 는 1 이상: 0 이하로 적어도 1 로 읽는다). 켠 채 바꾸기: /gave 자동 on|off(저장 안 됨)
autoStart: false
minPlayers: 1
# 판 시작 뒤 첫 웨이브까지 초
prepSeconds: 10
# 웨이브 사이 쉬는 시간(상점) 초. 36웨이브(엔딩 뒤 끝없는 구간)부터는 15초
breakSeconds: 25
# 판 전체 동시 잠복 감염 상한
latentCap: 4
# 난이도 손잡이(docs/모듈/파워커브.md 2.1절). 1.0 = 곡선 상수 그대로, 기준 1.15: 30명 보통 팀이 18웨이브 안팎에서 무너지고 35웨이브 엔딩은 아주 드묾.
# 올리면 몰려오는 수와 체력이 제곱근만큼, 받는 피해가 그대로 는다(1.5 면 30명 보통 팀 10웨이브, 0.8 이면 25웨이브). 켠 채 바꾸기: /gave 시험 균형 x DIFFICULTY <값>
difficulty: 1.15
# 게이브(보스 포함)가 사람에게 주는 피해 배율(0.1~10, 트럭 피해는 그대로). 켠 채 바꾸기: /gave 데미지 <배율>
damageMul: 1.0
# 사람이 게이브(보스 포함)에게 주는 피해 배율(0.1~10, 총, 폭발, 불, 냉동, 번개, 증강, 트럭 장치). 켠 채 바꾸기: /gave 공격력 <배율>
playerDamageMul: 1.0
# 판에 안 나오게 막은 종(2026-11-12 사용자 "시야 각도를 바꾸는 게이브는 등장하지 않게 해": 사람 시점을 돌리거나 흔드는 종, 근거 build/noview/list.md).
# 감독 묶음과 계획, 원정 막 덱('판의 모든 종' 셈 포함), 라운드와 특수, 다른 종이 부르는 소환에서 빠진다. 보스는 막지 않는다(보스의 시점 흔들기는 코드에서 뺌).
# /gave 소환 과 시험 훅은 그대로 놓는다. 빈 목록 [] 이면 모두 나온다. 첫 줄 22종은 직접 돌림, 둘째 줄 18종은 거인 걸음 화면 끄덕
bannedSpecies: [G21, G23, G28, G30, G36, G39, G57, G61, G74, G80, G81, G85, G120, G122, G134, G146, G151, G159, G163, G188, G189, G194]
# 보스 웨이브(10, 20, 30, 35 엔딩, 45, 그 뒤 10웨이브마다). bosses 를 끄면 보스 웨이브가 보통 웨이브가 된다. bossHp 는 보스 체력 배율(난이도와 따로 곱함,
# 2026-11-12 사용자 "보스 피통 40% 감소": 0.6)
bosses: true
bossHp: 0.6
# 보스가 아닌 모든 게이브의 체력 배율(2026-11-12 사용자 "모든 몹의 생명력 25% 줄여": 0.75). 종 기본 체력에 곱하고, 감독 배율 같은 곱셈은 그 위에 얹힌다
mobHp: 0.75
# 사람이 버는 모든 돈(처치, 보스, 라운드, 증강, 팀, 스테이지 보상)의 배율. 기본 1(운영자 행사용: 2 면 돈 두 배). 돌려받기, 사람끼리 옮기기에는 안 곱함.
# 2026-11-14 돈 구조를 바꾸며 옛 값(moneyMul 1.7, assistMul 2.0, roundMoneyMul 2.0)은 바탕 값에 녹였다. 옛 설정 파일(assistMul 이나 roundMoneyMul 이 남은 것)은
# 켤 때 한 번 moneyMul 을 1 로 돌리고 두 키를 지워 저장한다(Players). 1.7 로 되돌리면 두 번 곱해진다
moneyMul: 1.0
# 옛 대기실 방과 '게이브 우리'(이번 판 종 묶음이 유리 너머에서 도는 방). 기본 꺼짐: 대기실은 중앙 원이고 우리는 없다. 켜면 새 월드부터 방이 지어진다
cage: false
# 진짜 팀 보급 상자(웨이브 중 황야에 떨어짐). breakable 을 켜면 겨눠 쏜 총 직격에 부서져 사라진다(2026-11-12 사용자: 기본 꺼짐 = 안 부서짐)
crates:
  breakable: false
# 게임 안 도감(/도감). quickKey 를 끄면 도감 빠른 키용 데이터팩을 깔지 않는다(이미 깔린 것은 그대로)
dex:
  quickKey: true
# 래그돌 사체(docs/모듈/래그돌.md): 죽은 게이브가 맞은 쪽으로 튕겨 구르고 막대기가 늘어지다 굳어 땅으로 꺼진다. enabled 를 끄면 예전처럼 제자리에서 납작해짐
ragdoll:
  enabled: true
  # 물리 단계(매 틱 굴리는 래그돌)의 동시 수(구, 떼 마리는 안 셈)와 그 디스플레이 합. 넘으면 가장 오래된 것이 값싼 단계로 내려가 마저 날아가 눕는다
  active: 10
  activeDisplays: 50
  # 값싼 단계(죽는 순간 길을 끝까지 굴려 보고 키프레임만 보내는 사체)에서 날아가는 조각 최대. 넘치는 죽음만 예전처럼 납작해진다
  cheap: 150
  # 굳은 사체 디스플레이 최대(넘으면 오래된 것부터 땅으로 꺼짐), 굳은 뒤 남는 초(떼 마리는 memberSeconds)
  settled: 120
  settleSeconds: 12
  memberSeconds: 4
  # 굳은 사체 위에 다음 사체가 쌓임(끄면 겹침), 얼굴이 바닥에 깔리면 굴러 넘어가 누움
  pile: true
  faceUp: true
  # 한 구에서 흐물거리는 막대기 수 상한
  rods: 4
  # 충격 배율(1 = 기본), 중력(블록/틱^2), 튕김(반발 계수), 바닥 마찰
  kick: 1.0
  gravity: 0.08
  bounce: 0.3
  friction: 0.8
# 배경 음악(docs/모듈/브금.md, 곡은 tools/make_bgm.py 가 팩에 넣음). music 을 끄면 아무것도 안 틂. 크기 0..1,
# 소리 종류(VOICE 면 클라 설정 '음성/내레이터' 막대, MUSIC 이면 '음악' 막대로 줄임. 2026-11-12 사용자: 음성으로), musicLog 는 곡을 틀 때마다 서버 기록
music: true
musicVolume: 0.7
musicCategory: VOICE
musicLog: false
# 보탠 크리처 소리(2026-11-14, docs/소리출처.md '크리처 보강 소리'). 끄면 보탠 소리만 꺼지고 기존 소리는 그대로.
# near: 가까운 울음, 걸음, 죽을 때 살덩이, 사체 소리(사람마다 예산, kr.gave.mob.Ears). far: 가만히 집중해야 들리는 먼 저음 층(kr.gave.game.Horizon.farTick,
# 클라 '주변/환경' 막대, horizon.enabled 를 끄면 같이 꺼짐). farVolume: 웨이브 중 먼 부름이 듣는 귀에서 파일 크기의 몇 배인가(0..1). 0.28 이면 -34 LUFS
# (브금보다 11~13 LU 아래), 쉬는 시간 숨은 그 0.63 배(-38), 보스 앞 거대한 것은 1.585 배(-30). 또렷하게 0.45(-30), 조용하게 0.18(-38)
sfx:
  near: true
  far: true
  farVolume: 0.28
# 원정(docs/모듈/원정.md): 중앙 상점이 트럭이 되고(체력, 터지면 판 끝), 죽은 사람은 다른 사람이 돈을 내야 돌아온다. enabled 를 끄면 예전 판 그대로.
# enabled 는 손으로 고치지 말고 운영자 명령 '/gave 원정 on|off' 로 바꾼다(서버를 다시 켜지 않아도 되고, 정한 값이 이 칸에 저장된다).
# voteKeys: 숫자키 1 2 3 투표는 코드에서 늘 켜짐(RouteVote.KEYS), 이 칸은 끈 판에서도 켜는 덮개. afterLaunch: 발사 뒤 36라운드로 이어 감(기본 끔: 발사하면 판 끝).
# credits: 엔딩 다섯 줄 뒤 그 판 사람 이름 크레딧.
# 라운드가 끝나 쉬는 시간이 되면 죽은, 갇힌, 쓰러진 사람은 모두 공짜로 상점 앞에서 체력 가득으로 돌아온다(2026-11-12 사용자). 꺼내기(돈 내기)는 라운드 중에만.
# bossFreeRevive: 보스를 잡은 순간 죽은 사람도 모두 공짜로 꺼냄(기본 끔: 쉬는 시간 공짜 부활만. 엔딩 뒤 발사 차례에도 돎).
# noSpecials: 판에 안 나오게 할 특수 라운드 키(2026-11-12 사용자 "추격전이 안 나오게": chase). 막은 자리는 같은 막의 다른 특수나 hard 라운드,
# 보스 길목 '질주'는 험로로 바뀜. 빈 목록 [] 이면 모두 나옴. 시험 훅 '특수 x 키 시작'은 그대로 열림.
# tune: 숫자 표(kr.gave.trip.Trip.Tune) 덮어쓰기. 예) tune: {TRUCK_HP: 1200, REVIVE_U: 0.8}
trip:
  enabled: true
  voteKeys: false
  afterLaunch: false
  credits: true
  bossFreeRevive: false
  # intro: 판 시작 인트로(kr.gave.trip.Story, 장면표는 jar 의 trip/intro.json). full = 매 판 긴 판(목소리, 검은 화면 약 28초, 2026-11-16 기본),
  #   first = 서버를 켠 뒤 첫 판만 긴 판, 그다음 판부터 짧은 판(약 9초), short = 매 판 짧은 판, off = 인트로 없이 예전 오프닝(헌사 한 줄 뒤 이야기 한 줄)
  intro: full
  noSpecials: [chase, sandstorm]  # 2026-11-13 사용자 '모래폭풍 1뎀씩 주는 그거는 삭제해'
  tune: {}
